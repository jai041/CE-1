<!DOCTYPE html>
<html>
<head>
    <title>ShopEase Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cartholic</h1>
        <a href="#products">Products</a>
        <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
    </header>

    <div class="hero">
        <h2>Welcome to Cartholic</h2>
        <p>Shop your favourite products at affordable prices.</p>
    </div>

    <div class="container">

        <h2 id="products">Our Products</h2>

        <div class="filters">
            <input type="text" id="search" placeholder="Search products">

            <select id="category">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Accessories">Accessories</option>
            </select>

            <select id="sort">
                <option value="default">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>
        </div>

        <div id="product-list"></div>

        <h2 id="cart">Shopping Cart</h2>

        <div id="cart-items"></div>

        <div class="summary">
            <p>Subtotal: ₹<span id="subtotal">0</span></p>
            <p>Discount: ₹<span id="discount">0</span></p>
            <h3>Total: ₹<span id="total">0</span></h3>

            <input type="text" id="coupon" placeholder="Enter SAVE10">
            <button id="apply-coupon">Apply Coupon</button>

            <p id="coupon-message"></p>

            <button id="checkout">Proceed to Checkout</button>
        </div>

        <div id="checkout-section" class="hidden">
            <h2>Checkout</h2>

            <form id="checkout-form">
                <label>Name:</label>
                <input type="text" id="name" required>

                <label>Email:</label>
                <input type="email" id="email" required>

                <label>Address:</label>
                <textarea id="address" required></textarea>

                <label>Payment Method:</label>
                <select id="payment" required>
                    <option value="">Select Payment</option>
                    <option value="COD">Cash on Delivery</option>
                    <option value="UPI">UPI Demo</option>
                </select>

                <button type="submit">Place Order</button>
            </form>

            <p id="order-message"></p>
        </div>

    </div>

    <footer>
        <p>ShopEase | Ecommerce Mini Project | 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
